name: Export JSON/XML/YAML/CSV/MYSQL/PSQL/SQLITE/SQLSERVER/MONGODB

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**"
      - "!bin/Commands/Export**"
  workflow_dispatch:
    inputs:
      pass:
        description: "Passcode"
        required: true
      mode:
        description: "candidate: build and keep the files as a workflow artifact, publish nothing; production: tag, release and export PR (current master only)"
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - production

jobs:
  export:
    name: JSON/XML/YAML/CSV/MYSQL/PSQL/SQLITE/SQLSERVER/MONGODB
    runs-on: ubuntu-24.04
    env:
      # Push-triggered runs and runs without a mode only build a candidate; publishing needs an explicit production run
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'candidate' }}
    permissions:
      contents: read   # the build never writes; publishing happens in the publish job
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
      region_count: ${{ steps.meta.outputs.region_count }}
      subregion_count: ${{ steps.meta.outputs.subregion_count }}
      country_count: ${{ steps.meta.outputs.country_count }}
      state_count: ${{ steps.meta.outputs.state_count }}
      city_count: ${{ steps.meta.outputs.city_count }}
      county_count: ${{ steps.meta.outputs.county_count }}
      postcode_count: ${{ steps.meta.outputs.postcode_count }}
      postcode_country_count: ${{ steps.meta.outputs.postcode_country_count }}
      current_date: ${{ steps.meta.outputs.current_date }}

    strategy:
      matrix:
        php-version: [8.2]
        node-version: [20.x]
      fail-fast: false

    steps:
      # Production exports are built from the current master commit only: a release names the commit its data came from,
      # and the default token cannot publish from a source whose workflow files differ from master's (old runs included).
      # They also need the repository variable EXPORT_PRODUCTION_ENABLED = true, unset while exports are paused.
      - name: Require the current master commit
        if: env.MODE == 'production'
        uses: actions/github-script@v8
        env:
          EXPORT_PRODUCTION_ENABLED: ${{ vars.EXPORT_PRODUCTION_ENABLED }}
        with:
          script: |
            if (process.env.EXPORT_PRODUCTION_ENABLED !== 'true') {
              core.setFailed('Production exports are paused (repository variable EXPORT_PRODUCTION_ENABLED is not true)');
              return;
            }
            const { data: master } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'master',
            });
            if (context.ref !== 'refs/heads/master' || context.sha !== master.commit.sha) {
              core.setFailed('Exports require the current master commit; start a new run on master');
              return;
            }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: true
          ref: ${{ github.head_ref }}
          persist-credentials: false
          lfs: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl #optional
          coverage: none
          ini-values: "post_max_size=256M, memory_limit=512M" #optional

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: nmig/package-lock.json

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: bin/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('bin/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Start MySQL service
        run: |
          sudo systemctl start mysql.service
          mysql -V
          # Wait for MySQL to be ready
          while ! mysqladmin ping -h"127.0.0.1" --silent; do
            echo "Waiting for MySQL..."
            sleep 1
          done

      - name: Start PostgreSQL service
        run: |
          sudo systemctl start postgresql.service
          pg_isready
          pg_lsclusters
          sudo -u postgres psql -c "CREATE DATABASE world;"
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "\l"

      - name: Setup MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '6.0'
          mongodb-replica-set: rs0

      - name: Install MongoDB Database Tools
        run: |
          # Download MongoDB Database Tools directly
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.7.3.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2204-x86_64-100.7.3.deb
          rm -rf mongodb-database-tools-ubuntu2204-x86_64-100.7.3.deb

          # Verify installation
          mongoimport --version

      - name: Setup MySQL DB
        run: |
          echo "🗄️  Creating MySQL database..."
          mysql -uroot -proot -e "CREATE DATABASE world CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -uroot -proot -e "SHOW DATABASES;"
          echo "✅ Database created"

      - name: Initialize Database Schema
        run: |
          echo "📋 Creating database tables..."
          mysql -uroot -proot world < bin/db/schema.sql
          echo "✅ Schema initialized - verifying tables..."
          mysql -uroot -proot -e "USE world; SHOW TABLES;"
          mysql -uroot -proot -e "USE world; SHOW CREATE TABLE regions\G" | head -20
          echo "✅ All tables created successfully"

      - name: Setup Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python
          echo "✅ Python dependencies installed"

      - name: Import JSON to MySQL
        run: |
          echo "📥 Importing contributions to MySQL..."
          python3 bin/scripts/sync/import_json_to_mysql.py --host localhost --user root --password root --database world
          echo "✅ Import complete - IDs auto-assigned by MySQL"

      - name: Export MySQL to JSON (Validation)
        run: |
          echo "🔄 Syncing MySQL back to contributions JSON for validation..."
          python3 bin/scripts/sync/sync_mysql_to_json.py --host localhost --user root --password root --database world
          echo "✅ MySQL → JSON sync complete"
          echo "📊 Validating round-trip consistency..."
          git diff --stat contributions/
          # fails when a record that had an id comes back changed or missing (new ids for id-less rows are expected)
          python3 bin/scripts/sync/check_round_trip.py --ref HEAD

      - name: Setup & Run NMIG (MySQL to PostgreSQL)
        run: |
          cp nmig.config.json nmig/config/config.json
          cd nmig
          npm install
          npm run build
          npm start
          cd ..

      - name: Setup MySQLtoSQLite
        run: |
          python -m pip install --upgrade pip
          pip install "mysql-to-sqlite3<2.5.6" "sqlglot<30"
          mysql2sqlite --version

      - name: Setup variables
        run: |
          echo "region_count=$(mysql -uroot -proot -e 'SELECT COUNT(*) FROM world.regions;' -s)" >> $GITHUB_ENV
          echo "subregion_count=$(mysql -uroot -proot -e 'SELECT COUNT(*) FROM world.subregions;' -s)" >> $GITHUB_ENV
          echo "country_count=$(mysql -uroot -proot -e 'SELECT COUNT(*) FROM world.countries;' -s)" >> $GITHUB_ENV
          echo "state_count=$(mysql -uroot -proot -e 'SELECT COUNT(*) FROM world.states;' -s)" >> $GITHUB_ENV
          echo "city_count=$(mysql -uroot -proot -e 'SELECT COUNT(*) FROM world.cities;' -s)" >> $GITHUB_ENV
          echo "county_count=$(mysql -uroot -proot -sN -e 'SELECT COUNT(*) FROM world.counties;' 2>/dev/null || echo 0)" >> $GITHUB_ENV
          echo "postcode_count=$(mysql -uroot -proot -sN -e 'SELECT COUNT(*) FROM world.postcodes;' 2>/dev/null || echo 0)" >> $GITHUB_ENV
          echo "postcode_country_count=$(mysql -uroot -proot -sN -e 'SELECT COUNT(DISTINCT country_code) FROM world.postcodes;' 2>/dev/null || echo 0)" >> $GITHUB_ENV
          echo "current_date=$(date +'%B %d, %Y')" >> $GITHUB_ENV

      - name: Composer Dependencies
        working-directory: ./bin
        run: |
          composer install
          php console list

      - name: Export JSON
        working-directory: ./bin
        run: php console export:json

      - name: Convert JSON to GeoJSON
        working-directory: ./bin
        run: |
          python3 scripts/export/json_to_geojson.py

      - name: Convert JSON to Toon Format
        working-directory: ./bin
        run: |
          python3 scripts/export/json_to_toon.py

      - name: Export Parquet
        working-directory: ./bin
        run: |
          pip install pandas pyarrow
          python3 scripts/export/json_to_parquet.py

      - name: Export XML
        working-directory: ./bin
        run: php console export:xml

      - name: Export YAML
        working-directory: ./bin
        run: php console export:yaml

      - name: Export CSV
        working-directory: ./bin
        run: php console export:csv

      - name: Export MySQL SQL
        run: |
          mkdir -p sql
          mysqldump -uroot -proot --single-transaction --add-drop-table --disable-keys --set-charset --skip-add-locks --complete-insert world regions > sql/regions.sql
          mysqldump -uroot -proot --single-transaction --add-drop-table --disable-keys --set-charset --skip-add-locks --complete-insert world subregions > sql/subregions.sql
          mysqldump -uroot -proot --single-transaction --add-drop-table --disable-keys --set-charset --skip-add-locks --complete-insert world countries > sql/countries.sql
          mysqldump -uroot -proot --single-transaction --add-drop-table --disable-keys --set-charset --skip-add-locks --complete-insert world states > sql/states.sql
          mysqldump -uroot -proot --single-transaction --add-drop-table --disable-keys --set-charset --skip-add-locks --complete-insert world cities > sql/cities.sql
          mysqldump -uroot -proot --single-transaction --add-drop-table --disable-keys --set-charset --skip-add-locks --complete-insert world counties > sql/counties.sql
          mysqldump -uroot -proot --single-transaction --add-drop-table --disable-keys --set-charset --skip-add-locks --complete-insert world county_states > sql/county_states.sql
          mysqldump -uroot -proot --single-transaction --add-drop-table --disable-keys --set-charset --skip-add-locks --complete-insert world postcodes > sql/postcodes.sql
          # Export complete world database
          mysqldump -uroot -proot --single-transaction --add-drop-table --disable-keys --set-charset --skip-add-locks --complete-insert world > sql/world.sql

      - name: Add DROP TABLE commands to world.sql
        run: |
          echo "🧹 Adding DROP TABLE commands in correct order..."
          # Remove any existing DROP TABLE commands
          grep -v "DROP TABLE" sql/world.sql > sql/world_temp.sql
          # Create new file with DROP TABLE commands in correct order (reverse of foreign key dependencies).
          # postcodes drops first because it FKs to countries/states/cities.
          cat > sql/world.sql << 'EOF'
          -- -------------------------------------------------------------
          -- Generated from MySQL database
          -- Combined world database
          -- -------------------------------------------------------------

          DROP TABLE IF EXISTS `postcodes`;
          DROP TABLE IF EXISTS `cities`;
          DROP TABLE IF EXISTS `county_states`;
          DROP TABLE IF EXISTS `counties`;
          DROP TABLE IF EXISTS `states`;
          DROP TABLE IF EXISTS `countries`;
          DROP TABLE IF EXISTS `subregions`;
          DROP TABLE IF EXISTS `regions`;

          EOF
          # Append the dump without DROP TABLE commands
          cat sql/world_temp.sql >> sql/world.sql
          rm sql/world_temp.sql
          echo "✅ DROP TABLE commands added"

      - name: Generate Schema Files
        run: |
          echo "📋 Generating schema files..."
          # Export MySQL schema only (no data)
          mysqldump -uroot -proot --no-data --single-transaction --add-drop-table world > sql/schema.sql
          echo "✅ Schema files generated"

      - name: Export PostgreSQL SQL
        env:
          PGPASSWORD: postgres
        run: |
          mkdir -p psql
          # Export PostgreSQL schema only (no data)
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --schema-only --clean --if-exists --no-owner --no-acl > psql/schema.sql
          # Export individual tables with data
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --column-inserts --rows-per-insert=1000 --clean --if-exists --no-owner --no-acl -t regions > psql/regions.sql
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --column-inserts --rows-per-insert=1000 --clean --if-exists --no-owner --no-acl -t subregions > psql/subregions.sql
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --column-inserts --rows-per-insert=1000 --clean --if-exists --no-owner --no-acl -t countries > psql/countries.sql
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --column-inserts --rows-per-insert=1000 --clean --if-exists --no-owner --no-acl -t states > psql/states.sql
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --column-inserts --rows-per-insert=1000 --clean --if-exists --no-owner --no-acl -t cities > psql/cities.sql
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --column-inserts --rows-per-insert=1000 --clean --if-exists --no-owner --no-acl -t counties > psql/counties.sql
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --column-inserts --rows-per-insert=1000 --clean --if-exists --no-owner --no-acl -t county_states > psql/county_states.sql
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --column-inserts --rows-per-insert=1000 --clean --if-exists --no-owner --no-acl -t postcodes > psql/postcodes.sql
          pg_dump --dbname=postgresql://postgres:postgres@localhost/world -Fp --column-inserts --rows-per-insert=1000 --clean --if-exists --no-owner --no-acl > psql/world.sql

          # Remove \restrict and \unrestrict commands from all psql files
          for f in psql/*.sql; do
            grep -v '^\\\(un\)\?restrict ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Check the SQL dumps load back
        # Every INSERT names its columns (--complete-insert, --column-inserts), so a row lands in the right column or
        # fails loudly in an older table (#2053). Load both world dumps into fresh databases and compare each table
        # with its source by row count and a per-row checksum; a dump that does not reproduce the data fails the build.
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          tables="regions subregions countries states cities counties county_states postcodes"
          mysql -uroot -proot -e "DROP DATABASE IF EXISTS world_check; CREATE DATABASE world_check CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -uroot -proot --default-character-set=utf8mb4 world_check < sql/world.sql
          for t in $tables; do
            a=$(mysql -uroot -proot -N -e "CHECKSUM TABLE world.$t" | cut -f2)
            b=$(mysql -uroot -proot -N -e "CHECKSUM TABLE world_check.$t" | cut -f2)
            [ "$a" = "$b" ] || { echo "::error::sql/world.sql does not reproduce $t (checksum $a vs $b)"; exit 1; }
          done
          psql -h localhost -U postgres -q -c "DROP DATABASE IF EXISTS world_check;" -c "CREATE DATABASE world_check;"
          psql -h localhost -U postgres -q -v ON_ERROR_STOP=1 -d world_check -f psql/world.sql > /dev/null
          for t in $tables; do
            q="SELECT count(*) || ':' || coalesce(sum(hashtext(r::text)::bigint), 0) FROM public.$t r"
            a=$(psql -h localhost -U postgres -At -d world -c "$q")
            b=$(psql -h localhost -U postgres -At -d world_check -c "$q")
            [ "$a" = "$b" ] || { echo "::error::psql/world.sql does not reproduce $t ($a vs $b)"; exit 1; }
          done
          echo "SQL dumps load back and match the source for: $tables"

      - name: Export SQLite
        run: |
          # Clean up any existing SQLite files first
          rm -rf sqlite/
          mkdir -p sqlite

          mysql2sqlite -d world -t regions --mysql-password root -u root -f sqlite/regions.sqlite3
          mysql2sqlite -d world -t subregions --mysql-password root -u root -f sqlite/subregions.sqlite3
          mysql2sqlite -d world -t countries --mysql-password root -u root -f sqlite/countries.sqlite3
          mysql2sqlite -d world -t states --mysql-password root -u root -f sqlite/states.sqlite3
          mysql2sqlite -d world -t cities --mysql-password root -u root -f sqlite/cities.sqlite3
          mysql2sqlite -d world -t counties --mysql-password root -u root -f sqlite/counties.sqlite3
          mysql2sqlite -d world -t county_states --mysql-password root -u root -f sqlite/county_states.sqlite3
          mysql2sqlite -d world -t postcodes --mysql-password root -u root -f sqlite/postcodes.sqlite3
          mysql2sqlite -d world --mysql-password root -u root -f sqlite/world.sqlite3

      - name: Export SQL Server
        working-directory: ./bin
        run: php console export:sql-server

      - name: Export MongoDB
        working-directory: ./bin
        run: |
          php console export:mongodb
          ls -la ../mongodb

      - name: Import MongoDB
        working-directory: ./mongodb
        run: |
          # Wait for MongoDB to be ready
          sleep 5

          echo "Importing collections..."
          mongoimport --host localhost:27017 --db world --collection regions --file regions.json --jsonArray
          mongoimport --host localhost:27017 --db world --collection subregions --file subregions.json --jsonArray
          mongoimport --host localhost:27017 --db world --collection countries --file countries.json --jsonArray
          mongoimport --host localhost:27017 --db world --collection states --file states.json --jsonArray
          mongoimport --host localhost:27017 --db world --collection cities --file cities.json --jsonArray
          if [ -s counties.json ] && [ "$(jq 'length' counties.json)" -gt 0 ]; then
            mongoimport --host localhost:27017 --db world --collection counties --file counties.json --jsonArray
          else
            echo "Skipping counties import — empty or missing"
          fi
          if [ -s postcodes.json ] && [ "$(jq 'length' postcodes.json)" -gt 0 ]; then
            mongoimport --host localhost:27017 --db world --collection postcodes --file postcodes.json --jsonArray
          else
            echo "Skipping postcodes import — empty or missing"
          fi
          echo "Import completed"

          # Create a MongoDB dump
          mongodump --host localhost:27017 --db world --out mongodb-dump

          # Compress the dump
          tar -czvf world-mongodb-dump.tar.gz mongodb-dump
          echo "MongoDB dump created at mongodb/world-mongodb-dump.tar.gz"

          rm -rf mongodb-dump regions.json subregions.json countries.json states.json cities.json counties.json postcodes.json

      - name: Compress All Large Files
        run: |
          echo "🗜️  Compressing all large files..."
          echo "================================"

          # JSON Files
          echo "📄 Compressing JSON files..."
          if [ -f json/countries+states+cities.json ]; then
            gzip -9 -k -f json/countries+states+cities.json
            echo "  ✓ json/countries+states+cities.json.gz"
          fi
          if [ -f json/cities.json ]; then
            gzip -9 -k -f json/cities.json
            echo "  ✓ json/cities.json.gz"
          fi
          if [ -f json/postcodes.json ]; then
            gzip -9 -k -f json/postcodes.json
            echo "  ✓ json/postcodes.json.gz"
          fi

          # Counties: separate compressed assets for all formats.
          # county_states: the regions of counties of several regions (v5), released beside each table-shaped county file
          for file in json/counties.json csv/counties.csv xml/counties.xml yml/counties.yml geojson/counties.geojson toon/counties.toon parquet/counties.parquet sql/counties.sql psql/counties.sql sqlite/counties.sqlite3 sqlserver/counties.sql csv/county_states.csv sql/county_states.sql psql/county_states.sql sqlite/county_states.sqlite3 sqlserver/county_states.sql; do
            if [ -f "$file" ]; then gzip -9 -k -f "$file"; fi
          done

          # TOON Files
          echo "📄 Compressing TOON files..."
          if [ -f toon/cities.toon ]; then
            gzip -9 -k -f toon/cities.toon
            echo "  ✓ toon/cities.toon.gz"
          fi

          # GEOJSON Files
          echo "📄 Compressing GEOJSON files..."
          if [ -f geojson/cities.geojson ]; then
            gzip -9 -k -f geojson/cities.geojson
            echo "  ✓ geojson/cities.geojson.gz"
          fi

          # XML Files
          echo "📄 Compressing XML files..."
          if [ -f xml/cities.xml ]; then
            gzip -9 -k -f xml/cities.xml
            echo "  ✓ xml/cities.xml.gz"
          fi
          if [ -f xml/postcodes.xml ]; then
            gzip -9 -k -f xml/postcodes.xml
            echo "  ✓ xml/postcodes.xml.gz"
          fi

          # YAML Files
          echo "📄 Compressing YAML files..."
          if [ -f yml/cities.yml ]; then
            gzip -9 -k -f yml/cities.yml
            echo "  ✓ yml/cities.yml.gz"
          fi
          if [ -f yml/postcodes.yml ]; then
            gzip -9 -k -f yml/postcodes.yml
            echo "  ✓ yml/postcodes.yml.gz"
          fi

          # CSV Files
          echo "📄 Compressing CSV files..."
          if [ -f csv/cities.csv ]; then
            gzip -9 -k -f csv/cities.csv
            echo "  ✓ csv/cities.csv.gz"
          fi
          if [ -f csv/translations.csv ]; then
            gzip -9 -k -f csv/translations.csv
            echo "  ✓ csv/translations.csv.gz"
          fi
          if [ -f csv/postcodes.csv ]; then
            gzip -9 -k -f csv/postcodes.csv
            echo "  ✓ csv/postcodes.csv.gz"
          fi

          # Parquet Files (large tables only; small ones are committed to git)
          echo "📄 Compressing Parquet files..."
          if [ -f parquet/cities.parquet ]; then
            gzip -9 -k -f parquet/cities.parquet
            echo "  ✓ parquet/cities.parquet.gz"
          fi
          if [ -f parquet/postcodes.parquet ]; then
            gzip -9 -k -f parquet/postcodes.parquet
            echo "  ✓ parquet/postcodes.parquet.gz"
          fi

          # MySQL SQL Files
          echo "📄 Compressing MySQL SQL files..."
          gzip -9 -k -f sql/world.sql
          gzip -9 -k -f sql/cities.sql
          echo "  ✓ sql/world.sql.gz"
          echo "  ✓ sql/cities.sql.gz"
          if [ -f sql/postcodes.sql ]; then
            gzip -9 -k -f sql/postcodes.sql
            echo "  ✓ sql/postcodes.sql.gz"
          fi

          # PostgreSQL SQL Files
          echo "📄 Compressing PostgreSQL SQL files..."
          gzip -9 -k -f psql/world.sql
          gzip -9 -k -f psql/cities.sql
          echo "  ✓ psql/world.sql.gz"
          echo "  ✓ psql/cities.sql.gz"
          if [ -f psql/postcodes.sql ]; then
            gzip -9 -k -f psql/postcodes.sql
            echo "  ✓ psql/postcodes.sql.gz"
          fi

          # SQLite Files
          echo "📄 Compressing SQLite files..."
          gzip -9 -k -f sqlite/world.sqlite3
          gzip -9 -k -f sqlite/cities.sqlite3
          echo "  ✓ sqlite/world.sqlite3.gz"
          echo "  ✓ sqlite/cities.sqlite3.gz"
          if [ -f sqlite/postcodes.sqlite3 ]; then
            gzip -9 -k -f sqlite/postcodes.sqlite3
            echo "  ✓ sqlite/postcodes.sqlite3.gz"
          fi

          # SQL Server Files
          echo "📄 Compressing SQL Server files..."
          if [ -f sqlserver/world.sql ]; then
            gzip -9 -k -f sqlserver/world.sql
            echo "  ✓ sqlserver/world.sql.gz"
          fi
          if [ -f sqlserver/cities.sql ]; then
            gzip -9 -k -f sqlserver/cities.sql
            echo "  ✓ sqlserver/cities.sql.gz"
          fi
          if [ -f sqlserver/postcodes.sql ]; then
            gzip -9 -k -f sqlserver/postcodes.sql
            echo "  ✓ sqlserver/postcodes.sql.gz"
          fi

          echo "================================"
          echo "✅ All compression complete!"
          echo ""
          echo "📊 Compressed file sizes:"
          ls -lh json/*.gz toon/*.gz geojson/*.gz xml/*.gz yml/*.gz csv/*.gz parquet/*.gz sql/*.gz psql/*.gz sqlite/*.gz sqlserver/*.gz 2>/dev/null || true

      - name: Update README.md
        run: |
          county_total=$(python3 -c 'import sys; print(f"{int(sys.argv[1]):,}")' "$county_count")
          sed -i "s/\*\*[0-9,]*\*\* counties/**$county_total** counties/" README.md
          sed -i "s/Total Regions : [0-9]* <br>/Total Regions : $region_count <br>/" README.md
          sed -i "s/Total Sub Regions : [0-9]* <br>/Total Sub Regions : $subregion_count <br>/" README.md
          sed -i "s/Total Countries : [0-9]* <br>/Total Countries : $country_count <br>/" README.md
          sed -i "s/Total States\/Regions\/Municipalities : [0-9]* <br>/Total States\/Regions\/Municipalities : $state_count <br>/" README.md
          sed -i "s/Total Cities\/Towns\/Districts : [0-9]* <br>/Total Cities\/Towns\/Districts : $city_count <br>/" README.md
          sed -i "s/Total Postcodes : [0-9,]* ([0-9]* countries) <br>/Total Postcodes : $postcode_count ($postcode_country_count countries) <br>/" README.md
          sed -i "s/Last Updated On: .*$/Last Updated On: $current_date/" README.md

      - name: Check every file a release carries
        run: |
          # Fails when any expected export is missing or empty, or the required notice is absent (both modes)
          required=(
            csv/cities.csv.gz
            csv/counties.csv.gz
            csv/county_states.csv.gz
            csv/postcodes.csv.gz
            csv/translations.csv.gz
            geojson/cities.geojson.gz
            geojson/counties.geojson.gz
            json/cities.json.gz
            json/counties.json.gz
            json/countries+states+cities.json.gz
            json/postcodes.json.gz
            mongodb/world-mongodb-dump.tar.gz
            parquet/cities.parquet.gz
            parquet/counties.parquet.gz
            parquet/postcodes.parquet.gz
            psql/cities.sql.gz
            psql/counties.sql.gz
            psql/county_states.sql.gz
            psql/postcodes.sql.gz
            psql/world.sql.gz
            sql/cities.sql.gz
            sql/counties.sql.gz
            sql/county_states.sql.gz
            sql/postcodes.sql.gz
            sql/world.sql.gz
            sqlite/cities.sqlite3.gz
            sqlite/counties.sqlite3.gz
            sqlite/county_states.sqlite3.gz
            sqlite/postcodes.sqlite3.gz
            sqlite/world.sqlite3.gz
            sqlserver/cities.sql.gz
            sqlserver/counties.sql.gz
            sqlserver/county_states.sql.gz
            sqlserver/postcodes.sql.gz
            sqlserver/world.sql.gz
            toon/cities.toon.gz
            toon/counties.toon.gz
            xml/cities.xml.gz
            xml/counties.xml.gz
            xml/postcodes.xml.gz
            yml/cities.yml.gz
            yml/counties.yml.gz
            yml/postcodes.yml.gz
          )
          for file in "${required[@]}"; do
            [ -s "$file" ] || { echo "::error::missing or empty required export: $file"; exit 1; }
          done
          [ -s .github/licenses/Unicode-3.0.txt ] || { echo "::error::Required notice Unicode-3.0.txt is missing"; exit 1; }
          python3 bin/scripts/export/check_county_states_csv.py   # the CSV companion lists exactly json/counties.json's regions
          echo "${#required[@]} exports and the notices present"

      - name: Package the build with its checksums
        run: |
          mkdir -p export-notices && cp .github/licenses/*.txt export-notices/
          # The small files a production export PR would commit: tracked and new unignored files in the export folders,
          # the schema, the README and contributions, as generated by this run
          git ls-files -z --cached --others --exclude-standard -- json csv xml yml toon geojson parquet sql psql sqlite \
            sqlserver bin/db/schema.sql README.md contributions | grep -zv '\.gz$' | tar --null -czf export-small-files.tar.gz -T -
          files=(
            csv/cities.csv.gz
            csv/counties.csv.gz
            csv/county_states.csv.gz
            csv/postcodes.csv.gz
            csv/translations.csv.gz
            geojson/cities.geojson.gz
            geojson/counties.geojson.gz
            json/cities.json.gz
            json/counties.json.gz
            json/countries+states+cities.json.gz
            json/postcodes.json.gz
            mongodb/world-mongodb-dump.tar.gz
            parquet/cities.parquet.gz
            parquet/counties.parquet.gz
            parquet/postcodes.parquet.gz
            psql/cities.sql.gz
            psql/counties.sql.gz
            psql/county_states.sql.gz
            psql/postcodes.sql.gz
            psql/world.sql.gz
            sql/cities.sql.gz
            sql/counties.sql.gz
            sql/county_states.sql.gz
            sql/postcodes.sql.gz
            sql/world.sql.gz
            sqlite/cities.sqlite3.gz
            sqlite/counties.sqlite3.gz
            sqlite/county_states.sqlite3.gz
            sqlite/postcodes.sqlite3.gz
            sqlite/world.sqlite3.gz
            sqlserver/cities.sql.gz
            sqlserver/counties.sql.gz
            sqlserver/county_states.sql.gz
            sqlserver/postcodes.sql.gz
            sqlserver/world.sql.gz
            toon/cities.toon.gz
            toon/counties.toon.gz
            xml/cities.xml.gz
            xml/counties.xml.gz
            xml/postcodes.xml.gz
            yml/cities.yml.gz
            yml/counties.yml.gz
            yml/postcodes.yml.gz
            export-notices/*.txt export-small-files.tar.gz
          )
          sha256sum "${files[@]}" > EXPORT_SHA256SUMS
          echo "source ${GITHUB_SHA} ref ${GITHUB_REF} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" > EXPORT_SOURCE
          wc -l EXPORT_SHA256SUMS

      - name: Record the build
        id: meta
        run: |
          echo "artifact=export-build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "region_count=${region_count}" >> "$GITHUB_OUTPUT"
          echo "subregion_count=${subregion_count}" >> "$GITHUB_OUTPUT"
          echo "country_count=${country_count}" >> "$GITHUB_OUTPUT"
          echo "state_count=${state_count}" >> "$GITHUB_OUTPUT"
          echo "city_count=${city_count}" >> "$GITHUB_OUTPUT"
          echo "county_count=${county_count}" >> "$GITHUB_OUTPUT"
          echo "postcode_count=${postcode_count}" >> "$GITHUB_OUTPUT"
          echo "postcode_country_count=${postcode_country_count}" >> "$GITHUB_OUTPUT"
          echo "current_date=${current_date}" >> "$GITHUB_OUTPUT"

      - name: Keep the build as a workflow artifact (candidate runs end here; nothing is published)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            json/*.gz
            sql/*.gz
            psql/*.gz
            sqlite/*.gz
            sqlserver/*.gz
            xml/*.gz
            yml/*.gz
            csv/*.gz
            toon/*.gz
            geojson/*.gz
            parquet/*.gz
            mongodb/world-mongodb-dump.tar.gz
            export-notices/*.txt
            export-small-files.tar.gz
            EXPORT_SHA256SUMS
            EXPORT_SOURCE
          if-no-files-found: error
          retention-days: 30

  # Migration files (migrations/README.md): how this build's ids relate to the last major and the last export. Runs after
  # a successful build, on its own runner with the full history the generator walks; publishing needs it to succeed.
  migrations:
    name: Release migration files
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read   # reads the history and the list of published releases
    outputs:
      artifact: ${{ steps.generate.outputs.artifact }}
      data_version: ${{ steps.generate.outputs.data_version }}
    steps:
      - name: Checkout the source commit with its full history and tags
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false

      - name: Generate the migration files
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'candidate' }}
        run: |
          flag=(); [ "$MODE" = production ] && flag=(--production)
          python3 bin/scripts/release/release_migrations.py --to "$GITHUB_SHA" --out "$RUNNER_TEMP/migrations" "${flag[@]}"
          echo "artifact=migrations-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          python3 -c 'import json, sys; print("data_version=" + json.load(open(sys.argv[1]))["data_version"])' \
            "$RUNNER_TEMP/migrations/release_meta.json" >> "$GITHUB_OUTPUT"

      - name: Keep the migration files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate.outputs.artifact }}
          path: |
            ${{ runner.temp }}/migrations/migrations-from-*.tar.gz
            ${{ runner.temp }}/migrations/MIGRATIONS_SHA256SUMS
            ${{ runner.temp }}/migrations/MIGRATIONS_SOURCE
          if-no-files-found: error
          retention-days: 30

  # Publishing: only a production run with the switch on, after a successful build of this same commit. This job holds
  # the write token and runs no build or dependency scripts: it places the verified build files and publishes them.
  publish:
    name: Publish the release and export PR
    needs: [export, migrations]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'production' && vars.EXPORT_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # release, tag, assets and the export branch
      pull-requests: write   # the export PR and its labels
    env:
      region_count: ${{ needs.export.outputs.region_count }}
      subregion_count: ${{ needs.export.outputs.subregion_count }}
      country_count: ${{ needs.export.outputs.country_count }}
      state_count: ${{ needs.export.outputs.state_count }}
      city_count: ${{ needs.export.outputs.city_count }}
      county_count: ${{ needs.export.outputs.county_count }}
      postcode_count: ${{ needs.export.outputs.postcode_count }}
      postcode_country_count: ${{ needs.export.outputs.postcode_country_count }}
      current_date: ${{ needs.export.outputs.current_date }}

    steps:
      - name: Checkout the source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          lfs: false

      - name: Download this run's build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.export.outputs.artifact }}
          path: ${{ runner.temp }}/build

      - name: Verify and place the build
        run: |
          cd "$RUNNER_TEMP/build"
          sha256sum -c --quiet EXPORT_SHA256SUMS
          grep -q "^source ${GITHUB_SHA} " EXPORT_SOURCE || { echo "::error::the build is not from this commit"; exit 1; }
          tar -xzf export-small-files.tar.gz -C "$GITHUB_WORKSPACE"
          # copy exactly the verified exports named in the checksum list; any failed copy stops the job
          n=0
          while IFS= read -r f; do
            cp --parents "$f" "$GITHUB_WORKSPACE/"; n=$((n + 1))
          done < <(cut -c 67- EXPORT_SHA256SUMS | grep '\.gz$' | grep -vx 'export-small-files.tar.gz')
          # the number of exports the build lists and the release gate requires (export-readme.test.js keeps them equal)
          [ "$n" -eq 43 ] || { echo "::error::expected 43 exports in the build, placed $n"; exit 1; }
          echo "placed $n exports and the small files"

      - name: Download and verify this run's migration files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.migrations.outputs.artifact }}
          path: ${{ runner.temp }}/migrations

      - name: Check the migration files
        run: |
          cd "$RUNNER_TEMP/migrations"
          grep -qx "source ${GITHUB_SHA}" MIGRATIONS_SOURCE || { echo "::error::the migration files are not from this commit"; exit 1; }
          sha256sum -c --strict MIGRATIONS_SHA256SUMS
          n=$(wc -l < MIGRATIONS_SHA256SUMS); [ "$n" -ge 1 ] || { echo "::error::no migration archive"; exit 1; }
          echo "verified $n migration archive(s)"

      - name: Create GitHub Release with exports
        uses: actions/github-script@v8
        env:
          EXPORT_PRODUCTION_ENABLED: ${{ vars.EXPORT_PRODUCTION_ENABLED }}
          MIGRATIONS_DATA_VERSION: ${{ needs.migrations.outputs.data_version }}
          CURRENT_DATE: ${{ env.current_date }}
          REGION_COUNT: ${{ env.region_count }}
          SUBREGION_COUNT: ${{ env.subregion_count }}
          COUNTRY_COUNT: ${{ env.country_count }}
          STATE_COUNT: ${{ env.state_count }}
          CITY_COUNT: ${{ env.city_count }}
          COUNTY_COUNT: ${{ env.county_count }}
          POSTCODE_COUNT: ${{ env.postcode_count }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            if (process.env.EXPORT_PRODUCTION_ENABLED !== 'true') {
              core.setFailed('Production exports are paused (repository variable EXPORT_PRODUCTION_ENABLED is not true)');
              return;
            }
            // Master may have moved during the build: check again before anything is created
            const { data: master } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'master',
            });
            if (context.ref !== 'refs/heads/master' || context.sha !== master.commit.sha) {
              core.setFailed('Exports require the current master commit; start a new run on master');
              return;
            }

            // Third-party notices must travel with every release (e.g. Unicode-3.0 for CLDR country names). Read and
            // check them before anything is created, so a missing or unreadable notice stops the run.
            const noticeDir = '.github/licenses';
            if (!fs.existsSync(noticeDir)) {
              core.setFailed(`${noticeDir} is missing; required notices cannot be published`);
              return;
            }
            const noticeFiles = fs.readdirSync(noticeDir).filter(f => f.endsWith('.txt'));
            if (!noticeFiles.includes('Unicode-3.0.txt')) {   // required while country translations carry CLDR names
              core.setFailed('Required notice Unicode-3.0.txt is missing');
              return;
            }
            const noticeAssets = noticeFiles.map(f => ({ name: `NOTICE-${f}`, data: fs.readFileSync(path.join(noticeDir, f)) }));

            // Find latest feature release for base version, and count existing
            // export releases for that base version to determine next export number.
            //
            // Feature releases match `^v?\d+\.\d+(\.\d+)?$` (e.g. v4.0, v5.0.0); the newest by all three numbers wins,
            // and its own spelling is the export prefix. Export releases are `<feature>-export.N` (e.g. v4.0-export.51)
            // and are explicitly excluded from the base-version search even though
            // they are not flagged as prereleases (they need to be non-prerelease
            // so downstream tools that pull /releases/latest pick up the data).
            //
            // If no feature release is found, the workflow FAILS rather than
            // falling back to v0.0 — silently shipping v0.0-export.N once is
            // already one tag too many.
            const featureRe = /^v?(\d+)\.(\d+)(?:\.(\d+))?$/;

            let bestMajor = 0, bestMinor = 0;
            let bestPatch = 0, baseVersion;
            let exportNum = 0;
            let releases;
            try {
              // every page: with more than 100 releases the newest feature release could be on a later one
              releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
            } catch (err) {
              core.setFailed(`Could not list releases to determine base version: ${err.message}`);
              return;
            }

            for (const rel of releases) {
              if (rel.prerelease || rel.draft) continue;
              const match = rel.tag_name.match(featureRe);
              if (!match) continue;
              const m = parseInt(match[1], 10);
              const n = parseInt(match[2], 10);
              const p = parseInt(match[3] ?? '0', 10);
              if (!baseVersion || m > bestMajor ||
                  (m === bestMajor && (n > bestMinor || (n === bestMinor && p > bestPatch)))) {
                bestMajor = m;
                bestMinor = n;
                bestPatch = p;
                baseVersion = rel.tag_name.replace(/^v/, '');
              }
            }

            if (!baseVersion) {
              core.setFailed('No feature release matching v<MAJOR>.<MINOR>[.<PATCH>] found. Cut a feature release first (gh release create vX.Y.Z --target master), then re-run this workflow.');
              return;
            }
            // The migration files carry the data version the migrations job picked the same way; they must agree
            if (baseVersion !== process.env.MIGRATIONS_DATA_VERSION) {
              core.setFailed(`This export would be named for v${baseVersion}, but its migration files say ${process.env.MIGRATIONS_DATA_VERSION}; start a new run`);
              return;
            }

            const exportRe = new RegExp(`^v?${baseVersion.replaceAll('.', '\\.')}-export\\.(\\d+)$`);
            for (const rel of releases) {
              const match = rel.tag_name.match(exportRe);
              if (match) {
                const num = parseInt(match[1]);
                if (num > exportNum) exportNum = num;
              }
            }

            // Tags left by a failed attempt count too, so a number is never reused
            const { data: tagRefs } = await github.rest.git.listMatchingRefs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/v${baseVersion}-export.`,
            });
            for (const r of tagRefs) {
              const match = r.ref.replace('refs/tags/', '').match(exportRe);
              if (match && parseInt(match[1]) > exportNum) exportNum = parseInt(match[1]);
            }

            exportNum++;
            const tag = `v${baseVersion}-export.${exportNum}`;

            core.info(`Base version: v${baseVersion}, creating export release ${tag}...`);

            // Reserve a fresh tag at the source commit; an existing tag makes this fail rather than point elsewhere
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            // Create a draft; publish only after every asset and notice upload succeeds
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,   // tag the exact source commit the data was built from
              name: tag,
              body: [
                `## ${tag} - ${process.env.CURRENT_DATE}`,
                '',
                `Data export build for v${baseVersion}.`,
                '',
                '### Data Statistics',
                `- **Regions**: ${process.env.REGION_COUNT}`,
                `- **Subregions**: ${process.env.SUBREGION_COUNT}`,
                `- **Countries**: ${process.env.COUNTRY_COUNT}`,
                `- **States**: ${process.env.STATE_COUNT}`,
                `- **Counties**: ${process.env.COUNTY_COUNT}`,
                `- **Cities**: ${process.env.CITY_COUNT}`,
                `- **Postcodes**: ${process.env.POSTCODE_COUNT}`,
                '',
                '### Formats',
                'JSON, MySQL, PostgreSQL, SQLite, SQL Server, XML, YAML, CSV, GeoJSON, Toon, MongoDB, Parquet',
                '',
                '### Licence and credits',
                'ODbL 1.0, attribution required. Some values come from sources that ask for credit (see the README). Their',
                'notices are attached as `NOTICE-*.txt` and must be kept with every copy of this data.',
                '',
                '### Migration files',
                'Each `migrations-from-<release>.tar.gz` says how ids changed since that release: removals and where they went,',
                'added ids, identity decisions and changed fields. See migrations/README.md.',
                '',
                '---',
                '*Auto-generated by GitHub Actions export workflow*',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });

            core.info(`Draft release created: ${release.html_url}`);

            // Upload all .gz files and mongodb dump
            const uploadPatterns = [
              'json/*.gz',
              'sql/*.gz',
              'psql/*.gz',
              'sqlite/*.gz',
              'sqlserver/*.gz',
              'xml/*.gz',
              'yml/*.gz',
              'csv/*.gz',
              'toon/*.gz',
              'geojson/*.gz',
              'parquet/*.gz',
              'mongodb/world-mongodb-dump.tar.gz',
            ];

            for (const pattern of uploadPatterns) {
              const globber = await glob.create(pattern);
              for await (const filePath of globber.globGenerator()) {
                // Prefix with directory to avoid name collisions
                // e.g. sql/cities.sql.gz → sql-cities.sql.gz, psql/cities.sql.gz → psql-cities.sql.gz
                const dir = path.basename(path.dirname(filePath));
                const base = path.basename(filePath);
                const assetName = `${dir}-${base}`;
                const fileSize = fs.statSync(filePath).size;
                core.info(`Uploading ${assetName} (${(fileSize / 1024 / 1024).toFixed(1)} MB)...`);

                const data = fs.readFileSync(filePath);
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  name: assetName,
                  data,
                });
              }
            }

            // Migration files (migrations/README.md): one archive per earlier release, as verified above
            const migrationDir = path.join(process.env.RUNNER_TEMP, 'migrations');
            const migrationFiles = fs.readdirSync(migrationDir).filter(f => /^migrations-from-.+\.tar\.gz$/.test(f));
            if (migrationFiles.length === 0) throw new Error('no migration archive to attach');
            for (const f of [...migrationFiles.sort(), 'MIGRATIONS_SHA256SUMS']) {
              core.info(`Uploading ${f}...`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: f,
                data: fs.readFileSync(path.join(migrationDir, f)),
              });
            }

            for (const asset of noticeAssets) {
              core.info(`Uploading ${asset.name}...`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: asset.name,
                data: asset.data,
              });
            }

            // Every asset and notice is attached: publish (an exception above leaves the draft unpublished)
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });

            core.info(`Release published with all export assets and ${noticeAssets.length} notices.`);

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          base: master
          commit-message: |
            Export database formats - ${{ env.current_date }}

            Total records: ${{ env.country_count }} countries, ${{ env.state_count }} states, ${{ env.county_count }} counties, ${{ env.city_count }} cities, ${{ env.postcode_count }} postcodes
            Large files (.gz) uploaded to GitHub Releases instead of git.
          committer: Darshan Gada <gadadarshan@gmail.com>
          signoff: true
          branch: export/Files
          delete-branch: true
          title: "Database Export - ${{ env.current_date }}"
          body: |
            ## Database Export

            ### Data Statistics
            - **Regions**: ${{ env.region_count }}
            - **Subregions**: ${{ env.subregion_count }}
            - **Countries**: ${{ env.country_count }}
            - **States**: ${{ env.state_count }}
            - **Counties**: ${{ env.county_count }}
            - **Cities**: ${{ env.city_count }}
            - **Postcodes**: ${{ env.postcode_count }}

            ### What's in this PR
            Small export files (individual table JSON, CSV, SQL schema, etc.) that are useful in the repo.

            ### What's in the Release
            All large compressed exports (.gz) are attached to the [latest release](https://github.com/${{ github.repository }}/releases) instead of committed to git.

            ---
            *Generated by GitHub Actions*
          labels: |
            exports
            automated
          reviewers: dr5hn
